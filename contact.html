<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Rebecca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
      * { font-family: 'Inter', sans-serif; }
      .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-950 text-gray-100">
    <header class="glass">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">Rebecca</h1>
            <ul class="flex gap-8 text-sm font-medium">
                <li><a href="index.html" class="hover:text-blue-400 transition">Home</a></li>
                <li><a href="about.html" class="hover:text-blue-400 transition">About</a></li>
                <li><a href="project.html" class="hover:text-blue-400 transition">Projects</a></li>
                <li><a href="contact.html" class="text-blue-400">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="py-24 px-6">
        <div class="max-w-4xl mx-auto">
            <div class="text-center mb-12">
                <p class="text-blue-400 font-medium mb-2">Get In Touch</p>
                <h2 class="text-4xl font-bold mb-4">Let's Work Together</h2>
                <p class="text-gray-400">Have a project in mind? Let's discuss how I can help</p>
            </div>
            <div class="glass p-8 rounded-2xl">
                <form id="contact-form" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">Name</label>
                            <input type="text" id="name" class="w-full bg-slate-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Email</label>
                            <input type="email" id="email" class="w-full bg-slate-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Message</label>
                        <textarea id="message" rows="5" class="w-full bg-slate-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-medium transition">Send Message</button>
                    <p id="form-status" class="hidden text-green-400 text-center">Message sent successfully!</p>
                </form>
                <div class="mt-8 pt-8 border-t border-gray-700 flex justify-center gap-6">
                    <a href="mailto:muteterirebecca60@gmail.com" class="text-gray-400 hover:text-blue-400 transition">muteterirebecca60@gmail.com</a>
                    <a href="https://github.com/Boldecca" target="_blank" class="text-gray-400 hover:text-blue-400 transition">GitHub</a>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-8 px-6 border-t border-gray-800">
        <div class="max-w-7xl mx-auto text-center text-gray-400 text-sm">
            <p>© 2025 Rebecca. All rights reserved.</p>
        </div>
    </footer>

    <script>
      document.getElementById('contact-form').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('form-status').classList.remove('hidden');
        e.target.reset();
      });
    </script>
</body>
</html>
